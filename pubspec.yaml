name: cartandorder
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.14.0
  firebase_auth: ^6.6.1
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.0.0
  image_picker: ^1.2.2
  flutter_staggered_animations: ^1.1.1
  url_launcher: ^6.3.0
  cloud_functions: ^6.5.0
  http: ^1.2.2
  firebase_analytics: ^12.6.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.6
  flutter_lints: ^5.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/model.png
    - assets/banner_one.png
    - assets/banner_two.png
    - assets/tracon_slider.png
    - assets/electric.png
    - assets/agarbatti.png
    


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#083BD6"
  android: true
  ios: true
  android_12:
    color: "#083BD6"

